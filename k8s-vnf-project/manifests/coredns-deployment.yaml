apiVersion: apps/v1
kind: Deployment
metadata:
  name: coredns-vnf
  namespace: coredns-vnf
spec:
  replicas: 1
  selector:
    matchLabels:
      app: coredns-vnf
  template:
    metadata:
      labels:
        app: coredns-vnf
    spec:
      containers:
      - name: coredns
        image: coredns/coredns:1.11.1
        args: ["-conf", "/etc/coredns/Corefile"]
        ports:
        - containerPort: 53
          protocol: UDP
        - containerPort: 53
          protocol: TCP
        - containerPort: 9153
          protocol: TCP
        volumeMounts:
        - name: config-volume
          mountPath: /etc/coredns
      volumes:
      - name: config-volume
        configMap:
          name: coredns-vnf-config
