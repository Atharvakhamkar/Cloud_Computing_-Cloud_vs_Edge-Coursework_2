apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-vnf-config
  namespace: coredns-vnf
data:
  Corefile: |
    .:53 {
        errors
        health {
          lameduck 5s
        }
        ready
        forward . 8.8.8.8 8.8.4.4
        prometheus :9153
        cache 30
        loop
        reload
        loadbalance
    }
